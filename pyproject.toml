[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "class-based-admin-actions"
version = "0.1.0"
description = "Class-based Django admin actions: compose reusable actions from mixins, like class-based views."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["django>=4.2"]
classifiers = [
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
]

[dependency-groups]
dev = ["pytest", "pytest-django"]

[tool.hatch.build.targets.wheel]
packages = ["src/class_based_admin_actions"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = [".", "src"]
