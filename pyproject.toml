[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "class-based-admin-actions"
version = "0.1.0"
description = "Class-based Django admin actions: compose reusable actions from mixins, like class-based views."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alejandro Rebecchi" }]
keywords = ["django", "admin", "actions", "class-based"]
dependencies = ["django>=4.2"]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
]

[project.urls]
Homepage = "https://github.com/cheverebe/class-based-admin-actions"
Issues = "https://github.com/cheverebe/class-based-admin-actions/issues"

[dependency-groups]
dev = ["pytest", "pytest-django"]

[tool.hatch.build.targets.wheel]
packages = ["src/class_based_admin_actions"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = [".", "src"]
